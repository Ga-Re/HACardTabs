name: Release

# Builds the card and publishes a GitHub release with hacardtabs.js attached.
# Trigger it by pushing a tag like "v1.0.0" or by running it manually (Actions → Release → Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish release with hacardtabs.js
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Card Tabs ${{ env.TAG }}
          generate_release_notes: true
          files: dist/hacardtabs.js
