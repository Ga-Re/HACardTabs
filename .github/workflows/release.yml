name: Release

# Push a tag like "v1.0.0" to build the card and publish a GitHub release with hacardtabs.js attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish release with hacardtabs.js
        uses: softprops/action-gh-release@v2
        with:
          name: Card Tabs ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/hacardtabs.js
